<!-- MODAL para modificar los campos de habitaciones-->

<div class="modal fade" id="modalGestionHabitacion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-white shadow-lg border-0">

            <div class="modal-header">
                <h5 class="modal-title fw-bold text-dark" id="tituloModalHabitacion">Gestionar Habitación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="formHabitacion">
                    <input type="hidden" id="habitacionId">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold text-secondary">ID</label>
                        <select id="habIdSelect" class="form-select">
                            <option value="">Seleccionar ID</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Nombre de la Habitación</label>
                            <input type="text" id="habNombre" class="form-control"
                                   placeholder="Ej: Suite Imperial UNO">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Número</label>
                            <input type="number" id="habNumero" class="form-control" placeholder="Ej: 101">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Descripción</label>
                        <textarea id="habDescripcion" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Tipo</label>
                            <select id="habTipo" class="form-select">
                                <option value="SIMPLE">Simple</option>
                                <option value="DOBLE">Doble</option>
                                <option value="SUITE">Suite</option>
                                <option value="FAMILIAR">Familiar</option>
                                <option value="DELUXE">Deluxe</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Precio por Noche (€)</label>
                            <input type="number" id="habPrecio" class="form-control" step="0.01">
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="btnGuardarHabitacion" class="btn btn-primary px-4 fw-bold">Guardar
                Cambios</button>
            </div>
        </div>
    </div>
</div>
